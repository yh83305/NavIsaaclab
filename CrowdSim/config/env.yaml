# Scene reference — points to a file in CrowdSim/config/scenes/
# Change this to switch scenes (e.g. "warehouse", "open_space", "narrow_corridor")
scene: warehouse


humanoid:
  human_mesh: true
  hide_humanoid: true
  checkpoint: data/pretrained_models/masked_mimic/smpl/last.ckpt
  motion_file: ../Assets/motion/amass_smpl_validation.pt
  
  min_heading_speed: 0.05

  state_recording:
    enabled: true
    record_fps: 10
    record_dir: output/crowdsim_humanoid_state
    record_envs: "0"
    auto_record: false
    key: H


car:
  usd: nova_carter
  prim_name: Car
  z: 0.0
  rl_policy: true
  policy_checkpoint: output/crowdsim_robot_ppo/latest/robot_ppo_latest.pt


sensors:
  camera:
    enabled: true
    height: 480
    width: 640
    horizontal_fov: 90.0
    # Rigid mount on the Nova Carter chassis (+x = forward, +z = up).
    mount_prim_path: chassis_link
    pos: [0.25, 0.0, 0.6]
    rot: [0.5, -0.5, 0.5, -0.5]
    convention: ros
    record_fps: 10.0
    record_dir: output/crowdsim_camera
    record_envs: "0"
    auto_record: false
  lidar:
    enabled: false
    debug_vis: false
    horizontal_res: 1.0
    mesh_prims: [/World/Scene]


navigation:
  num_humanoids: 10
  num_robots: 10

  path:
    seed: 7
    planning_step_size: 0.5
    planning_clearance: 0.5
    min_start_goal_distance: 7.0
    max_start_goal_distance: 10.0
    min_spawn_spacing: 1.5
  goal_tolerance: 0.75
  waypoint_tolerance: 0.5
  collision_distance: 0.7
  
  local: 
    target_timestep: 8.333333
    max_speed: 1.0
    agent_radius: 0.35
    safe_distance: 1.2
    neighbor_radius: 4.0
    interaction_radius: 5.0
    velocity_smoothing: 0.8
    max_acceleration: 4.0
    max_yaw_rate: 3.0
    prediction_horizon: 3.5
    ttc_threshold: 3.0
    ttc_gain: 28.0

  update_hz: 25.0
  log_interval: 30

  rl:
    deterministic: true
    num_neighbors: 4
    map_size: 24
    map_extent: 8.0
    max_linear_velocity: 1.0
    max_angular_velocity: 1.0
    # Start with the goal substantially off-axis to create balanced left/right
    # turning experience instead of always spawning pointed at the goal.
    initial_heading_min_offset_degrees: 30.0
    initial_heading_max_offset_degrees: 120.0
    # Fixed normalization scale; curriculum changes reset sampling only.
    goal_observation_max_distance: 10.0
    # Reset curriculum: increase route length and initial turning demand only
    # after the PPO policy maintains a high recent success rate.
    goal_curriculum:
      enabled: true
      window_size: 200
      min_episodes: 100
      update_interval_episodes: 50
      promote_success_rate: 0.75
      demote_success_rate: 0.45
      initial_stage: 0
      stages:
        short_straight:
          distance: [2.0, 4.0]
          heading_degrees: [0.0, 15.0]
        short_turn:
          distance: [3.0, 5.0]
          heading_degrees: [10.0, 45.0]
        medium_turn:
          distance: [4.0, 7.0]
          heading_degrees: [20.0, 75.0]
        long_turn:
          distance: [5.5, 8.5]
          heading_degrees: [30.0, 105.0]
        full:
          distance: [7.0, 10.0]
          heading_degrees: [30.0, 120.0]
    depth_enabled: true
    depth_size: 224
    depth_max_range: 5.0
    reward:
      progress_reward_scale: 5.0
      velocity_direction_reward_scale: 0.3
      angular_velocity_scale: 0.15
      angular_change_scale: 0.20
      linear_change_scale: 0.05
      # Proximity penalty: two-point linear function.
      #   d ≥ proximity_penalty_threshold  → 0
      #   proximity_danger_threshold ≤ d < proximity_penalty_threshold  → linearly interpolate
      #   d ≤ proximity_danger_threshold  → proximity_danger_penalty
      # Values are NEGATIVE (penalties); |proximity_danger_penalty| > |proximity_penalty_start|.
      proximity_penalty_start: 0.0          # 接近区外边界处的惩罚值（负值，线性起始点）
      proximity_penalty_threshold: 1.5       # 接近区外边界 (m)，d ≥ 此值不罚
      proximity_danger_threshold: 0.5        # 危险区内边界 (m)，d ≤ 此值时取 proximity_danger_penalty
      proximity_danger_penalty: -3.0         # 危险区固定惩罚值（负值，最大惩罚）
      # Weak wall shaping; bounded so it cannot dominate progress learning.
      static_proximity_threshold: 0.8
      static_proximity_danger_threshold: 0.25
      static_proximity_danger_penalty: -0.5
      goal_reward: 50.0
      collision_penalty: -50.0
      timeout_penalty: -50.0
      stuck_penalty: -30.0
      stuck_window: 250
      stuck_threshold: 0.1
      time_penalty: -0.01
      max_episode_steps: 1000

  recording:
    enabled: true
    output_dir: output/crowdsim_navigation


markers:
  enabled: true


viewer:
  camera_mode: free
  camera_eye: [8.0, -8.0, 15.0]
  camera_target: [0.0, 0.0, 1.0]


network:
  vector_hidden_dims: [128, 128]
  actor_hidden_dims: [256, 128, 32]
  critic_hidden_dims: [256, 128, 32]
  map_encoder:
    channels: [8, 16, 8]
    kernel_sizes: [3, 3, 3]
    strides: [2, 2, 1]
    paddings: [1, 1, 1]
  depth_encoder:
    channels: [16, 32]
    kernel_sizes: [3, 3]
    strides: [2, 2]
    paddings: [1, 1]
    feature_dim: 64


training:
  total_steps: 5000000
  rollout_steps: 256
  ppo_epochs: 4
  minibatch_size: 256
  lr: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  value_coef: 0.5
  entropy_coef: 0.005
  max_grad_norm: 1.0
  save_interval: 20000
  output_dir: output/crowdsim_robot_ppo
