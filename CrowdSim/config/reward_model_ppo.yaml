# Closed-loop PPO finetuning with CrowdSim/pref/offline_reward_model.py.
#
# Environment/sensor/scene settings remain in env.yaml. This file contains
# only the algorithm and learned-reward settings for reward-model PPO.
reward_model_ppo:
  total_steps: 500000
  rollout_steps: 256
  ppo_epochs: 4
  minibatch_size: 256
  lr: 0.00003
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  value_coef: 0.5
  entropy_coef: 0.005
  max_grad_norm: 1.0
  save_interval: 20000
  output_dir: output/crowdsim_reward_model_ppo

  # Constrain finetuning toward the base PPO policy.
  kl_beta: 0.02

  # The learned model represents pedestrian view clearance. Its output is
  # bounded again before composition as protection against reward hacking.
  learned_weight: 1.0
  learned_reward_clip: 5.0
  min_history_steps: 4

  # Navigation task terms prevent standing still from maximizing clearance.
  progress_weight: 2.0
  goal_bonus: 10.0
  collision_penalty: -10.0
  timeout_penalty: -3.0
  stuck_penalty: -3.0
  time_penalty: -0.005

  # Disabled by default because env.yaml already contains proximity shaping;
  # enabling it would count clearance twice.
  environment_reward_weight: 0.0
